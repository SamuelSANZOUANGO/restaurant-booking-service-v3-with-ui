<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Le Jardin Gourmand</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); }
    .stat-card { transition: all 0.3s ease; }
    .stat-card:hover { transform: translateY(-5px); }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

<div class="flex h-screen">
  <!-- Sidebar -->
  <div class="w-72 bg-black border-r border-zinc-800 p-6 flex flex-col">
    <div class="flex items-center gap-3 mb-10">
      <div class="w-10 h-10 bg-gradient-to-br from-amber-400 to-orange-500 rounded-xl flex items-center justify-center text-2xl">🍽️</div>
      <h1 class="text-2xl font-bold">Le Jardin</h1>
    </div>

    <nav class="space-y-2 flex-1">
      <a href="#" onclick="showSection('dashboard')" class="nav-link active flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-zinc-900">
        <i class="fas fa-home"></i> Tableau de bord
      </a>
      <a href="#" onclick="showSection('reservations')" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-zinc-900">
        <i class="fas fa-calendar"></i> Réservations
      </a>
      <a href="#" onclick="showSection('orders')" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-zinc-900">
        <i class="fas fa-utensils"></i> Commandes
      </a>
      <a href="#" onclick="showSection('tables')" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-zinc-900">
        <i class="fas fa-chair"></i> Gestion des Tables
      </a>
      <a href="#" onclick="showSection('deliveries')" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-zinc-900">
        <i class="fas fa-truck"></i> Livraisons
      </a>
    </nav>

    <div class="pt-6 border-t border-zinc-800">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-green-500 rounded-full"></div>
        <div>
          <p class="font-medium">Admin</p>
          <p class="text-xs text-zinc-500">Restaurant Manager</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex-1 overflow-auto">
    <!-- Top Bar -->
    <div class="bg-black border-b border-zinc-800 px-8 py-5 flex justify-between items-center sticky top-0 z-50">
      <h2 id="page-title" class="text-3xl font-semibold">Tableau de bord</h2>
      <div class="flex items-center gap-6">
        <div id="last-update" class="text-sm text-zinc-500"></div>
        <button onclick="refreshAll()" class="px-5 py-2 bg-zinc-900 hover:bg-zinc-800 rounded-xl flex items-center gap-2">
          <i class="fas fa-sync"></i> Rafraîchir
        </button>
      </div>
    </div>

    <div class="p-8" id="content">
      <!-- Contenu chargé dynamiquement par JavaScript -->
    </div>
  </div>
</div>

<script>
// Configuration API
const API_BASE = 'http://localhost:3000/api';

// Fonction pour afficher une section
function showSection(section) {
  document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active', 'bg-zinc-900'));
  event.currentTarget.classList.add('active', 'bg-zinc-900');
  
  document.getElementById('page-title').textContent = {
    'dashboard': 'Tableau de bord',
    'reservations': 'Réservations',
    'orders': 'Commandes en cours',
    'tables': 'Gestion des Tables',
    'deliveries': 'Suivi des Livraisons'
  }[section];

  loadSection(section);
}

// Chargement des sections
async function loadSection(section) {
  const content = document.getElementById('content');
  
  if (section === 'dashboard') {
    content.innerHTML = `
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
        <div class="glass p-6 rounded-2xl stat-card border border-zinc-700">
          <div class="flex justify-between">
            <div>
              <p class="text-zinc-400 text-sm">Réservations Aujourd'hui</p>
              <p id="today-bookings" class="text-4xl font-bold mt-2">24</p>
            </div>
            <i class="fas fa-calendar text-4xl text-amber-400"></i>
          </div>
        </div>
        <div class="glass p-6 rounded-2xl stat-card border border-zinc-700">
          <div class="flex justify-between">
            <div>
              <p class="text-zinc-400 text-sm">Commandes Actives</p>
              <p id="active-orders" class="text-4xl font-bold mt-2">18</p>
            </div>
            <i class="fas fa-utensils text-4xl text-orange-400"></i>
          </div>
        </div>
        <div class="glass p-6 rounded-2xl stat-card border border-zinc-700">
          <div class="flex justify-between">
            <div>
              <p class="text-zinc-400 text-sm">Chiffre d'Affaire</p>
              <p id="revenue" class="text-4xl font-bold mt-2">8.450 DH</p>
            </div>
            <i class="fas fa-money-bill-wave text-4xl text-green-400"></i>
          </div>
        </div>
        <div class="glass p-6 rounded-2xl stat-card border border-zinc-700">
          <div class="flex justify-between">
            <div>
              <p class="text-zinc-400 text-sm">Taux d'Occupation</p>
              <p id="occupancy" class="text-4xl font-bold mt-2">87%</p>
            </div>
            <i class="fas fa-chart-pie text-4xl text-purple-400"></i>
          </div>
        </div>
      </div>
      <!-- Autres contenus du dashboard -->
    `;
  } 
  else if (section === 'reservations') {
    const data = await fetch(`${API_BASE}/bookings`).then(r => r.json());
    // Générer tableau des réservations...
    content.innerHTML = `
      <div class="glass rounded-3xl overflow-hidden">
        <table class="w-full">
          <thead class="bg-zinc-900">
            <tr>
              <th class="p-4 text-left">Client</th>
              <th class="p-4 text-left">Table</th>
              <th class="p-4 text-left">Date & Heure</th>
              <th class="p-4 text-left">Personnes</th>
              <th class="p-4 text-left">Statut</th>
              <th class="p-4">Actions</th>
            </tr>
          </thead>
          <tbody id="reservations-body" class="divide-y divide-zinc-800"></tbody>
        </table>
      </div>
    `;
    renderReservations(data.data || []);
  }
  // Ajoute les autres sections de la même manière...
  else if (section === 'orders') 
    content.innerHTML = `
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-2xl font-semibold">Commandes en Cours</h3>
        <button onclick="createNewOrder()" 
                class="px-6 py-3 bg-gradient-to-r from-amber-500 to-orange-500 rounded-2xl font-medium flex items-center gap-2 hover:scale-105 transition">
          <i class="fas fa-plus"></i> Nouvelle Commande
        </button>
      </div>

      <div class="glass rounded-3xl overflow-hidden">
        <table class="w-full">
          <thead class="bg-zinc-900">
            <tr>
              <th class="p-5 text-left">Commande</th>
              <th class="p-5 text-left">Client</th>
              <th class="p-5 text-left">Type</th>
              <th class="p-5 text-left">Montant</th>
              <th class="p-5 text-left">Statut</th>
              <th class="p-5 text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="orders-body" class="divide-y divide-zinc-800"></tbody>
        </table>
      </div>
    `;
    loadOrders();
  }
  else if (section === 'deliveries') {
    // À venir dans la prochaine réponse si tu veux
  } 
}

// Fonction pour afficher les réservations
function renderReservations(bookings) {
  const tbody = document.getElementById('reservations-body');
  tbody.innerHTML = bookings.map(b => `
    <tr class="hover:bg-zinc-900/50">
      <td class="p-4">${b.customer_name}</td>
      <td class="p-4">Table ${b.table_number}</td>
      <td class="p-4">${b.booking_date} à ${b.booking_time}</td>
      <td class="p-4">${b.party_size} pers.</td>
      <td class="p-4">
        <span class="px-3 py-1 rounded-full text-xs ${b.status === 'confirmed' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}">
          ${b.status}
        </span>
      </td>
      <td class="p-4 text-center">
        <button onclick="cancelBooking('${b.id}')" class="text-red-400 hover:text-red-500">
          <i class="fas fa-times"></i>
        </button>
      </td>
    </tr>
  `).join('');
}

// ====================== PARTIE COMMANDES ======================

async function loadOrders() {
  try {
    const res = await fetch(`${API_BASE}/orders`);
    const data = await res.json();
    renderOrders(data.data || []);
  } catch (err) {
    console.error(err);
    document.getElementById('orders-body').innerHTML = `
      <tr><td colspan="6" class="p-8 text-center text-red-400">Erreur de chargement des commandes</td></tr>
    `;
  }
}

function renderOrders(orders) {
  const tbody = document.getElementById('orders-body');
  tbody.innerHTML = orders.map(order => {
    const items = JSON.parse(order.items || '[]');
    const statusColor = {
      'pending': 'bg-yellow-500/20 text-yellow-400',
      'preparing': 'bg-blue-500/20 text-blue-400',
      'ready': 'bg-green-500/20 text-green-400',
      'delivered': 'bg-purple-500/20 text-purple-400',
      'cancelled': 'bg-red-500/20 text-red-400'
    }[order.status] || 'bg-zinc-500/20 text-zinc-400';

    return `
      <tr class="hover:bg-zinc-900/50 transition">
        <td class="p-5">
          <div class="font-medium">#${order.id.slice(0,8)}</div>
          <div class="text-xs text-zinc-500">${items.length} articles</div>
        </td>
        <td class="p-5">
          <div>${order.customer_name}</div>
          <div class="text-xs text-zinc-500">${order.customer_email}</div>
        </td>
        <td class="p-5">
          <span class="px-4 py-1 text-xs rounded-full bg-zinc-800">
            ${order.order_type === 'delivery' ? 'Livraison' : order.order_type === 'takeaway' ? 'À emporter' : 'Sur place'}
          </span>
        </td>
        <td class="p-5 font-semibold">${order.total_amount} DH</td>
        <td class="p-5">
          <span class="px-4 py-1 rounded-full text-xs ${statusColor}">
            ${order.status}
          </span>
        </td>
        <td class="p-5 text-center">
          <div class="flex justify-center gap-3">
            <button onclick="updateOrderStatus('${order.id}', 'preparing')" class="text-blue-400 hover:text-blue-500">
              <i class="fas fa-clock"></i>
            </button>
            <button onclick="updateOrderStatus('${order.id}', 'ready')" class="text-green-400 hover:text-green-500">
              <i class="fas fa-check"></i>
            </button>
            <button onclick="deleteOrder('${order.id}')" class="text-red-400 hover:text-red-500">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

// Mise à jour du statut d'une commande
async function updateOrderStatus(id, newStatus) {
  if (!confirm(`Passer la commande au statut "${newStatus}" ?`)) return;
  
  try {
    await fetch(`${API_BASE}/orders/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: newStatus })
    });
    loadOrders(); // Rafraîchir
  } catch (err) {
    alert("Erreur lors de la mise à jour");
  }
}

// Supprimer / Annuler une commande
async function deleteOrder(id) {
  if (!confirm("Annuler cette commande ?")) return;
  await fetch(`${API_BASE}/orders/${id}`, { method: 'DELETE' });
  loadOrders();
}

// Créer une nouvelle commande
function createNewOrder() {
  const items = prompt("Articles (ex: Pizza Margherita x1, Burger x2) :");
  if (!items) return;

  const customerName = prompt("Nom du client :");
  const email = prompt("Email du client :");
  const amount = parseFloat(prompt("Montant total (DH) :"));

  fetch(`${API_BASE}/orders`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      customer_name: customerName,
      customer_email: email,
      items: [{ name: items, quantity: 1 }],
      total_amount: amount,
      order_type: 'dine-in'
    })
  })
  .then(() => loadOrders());
}

// Rafraîchissement global
async function refreshAll() {
  document.getElementById('last-update').textContent = `Dernière mise à jour : ${new Date().toLocaleTimeString('fr-FR')}`;
  // Recharger la section active
  const active = document.querySelector('.nav-link.active');
  if (active) active.click();
}

// Initialisation
document.addEventListener('DOMContentLoaded', () => {
  showSection('dashboard');
  setInterval(refreshAll, 30000); // Auto-refresh toutes les 30s
});
</script>

</body>
</html>
