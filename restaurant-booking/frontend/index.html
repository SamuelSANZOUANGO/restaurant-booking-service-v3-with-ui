<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Jardin Gourmand - Réservation & Commande</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .card-hover:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
  </style>
</head>
<body class="bg-zinc-950 text-white">
  <div class="min-h-screen">
    <!-- Navbar -->
    <nav class="bg-black/80 backdrop-blur-lg border-b border-zinc-800 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <h1 class="text-3xl font-bold bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">
          🍽️ Le Jardin Gourmand
        </h1>
        <div class="flex gap-6 text-lg">
          <a href="#" onclick="showSection('booking')" class="hover:text-amber-400 transition">Réservation</a>
          <a href="#" onclick="showSection('order')" class="hover:text-amber-400 transition">Commander</a>
        </div>
      </div>
    </nav>

    <!-- Contenu principal -->
    <div class="max-w-7xl mx-auto px-6 py-12" id="main-content">
      <!-- Sections dynamiques via JS -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
